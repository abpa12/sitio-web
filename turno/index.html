<!DOCTYPE html>
<html lang="es">
<head>
  
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Informe de turno · ABPA</title>
  <link rel="manifest" href="../manifest-turno.webmanifest">
  <meta name="theme-color" content="#0000CC">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Turno ABPA">
  <link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">
  <script>window.ABPA_MODO = 'turno';</script>
  <link rel="icon" type="image/png" href="../assets/img/favicon.png">
  <script src="../assets/config.js?v=20261026c"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
:root{
  --prim:#0000CC; --prim-2:#2a2ae6; --prim-bg:#e9e9fd; --amarillo:#FFCC00; --naranja:#E2620F;
  --verde:#16803c; --verde-2:#22a04f; --verde-bg:#e6f4ea; --verde-borde:#b7dcc2;
  --azul:#1f63c6; --azul-bg:#e7effb; --cielo:#e4e8ff;
  --ambar:#b26a00; --ambar-bg:#fff3dd;
  --rojo:#b3261e; --rojo-bg:#fdecea;
  --gris:#6b7280; --gris-bg:#eef0f2; --gris-2:#d1d5db;
  --tinta:#17231b; --tinta-2:#4b5563; --tinta-3:#6b7280;
  --fondo:#f4f6f4; --superficie:#ffffff; --borde:#e2e6e3;
  --radio:12px; --sombra:0 1px 2px rgba(16,24,20,.06),0 4px 16px rgba(16,24,20,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:var(--fondo);color:var(--tinta);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.2}
h2{font-size:20px;font-weight:700}
h3{font-size:15px;font-weight:650}
a{color:var(--azul)}
.oculto{display:none!important}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--tinta-3)}
.small{font-size:12.5px}

/* ── Barra superior ── */
.top{position:sticky;top:0;z-index:20;background:var(--prim);border-bottom:4px solid var(--amarillo);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.top-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.top img{width:44px;height:44px;border-radius:10px;background:#fff;padding:2px;object-fit:contain}
.top .marca{font-weight:700;font-size:15px;line-height:1.15}
.top .marca small{display:block;font-weight:400;opacity:.85;font-size:12px}
.top .usuario{margin-left:auto;text-align:right;font-size:12.5px;line-height:1.2}
.top .usuario b{display:block;font-size:13.5px}
.top .salir{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;padding:7px 12px;border-radius:8px;cursor:pointer}
.top .salir:hover{background:rgba(255,255,255,.24)}
.nav{background:#fff;border-bottom:1px solid var(--borde);position:sticky;top:68px;z-index:19}
.nav-in{max-width:1240px;margin:0 auto;display:flex;gap:4px;padding:0 12px;overflow-x:auto;scrollbar-width:none}
.nav button{background:none;border:0;padding:13px 14px;font-weight:600;color:var(--tinta-2);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.nav button:hover{color:var(--prim)}
.nav button.activo{color:var(--prim);border-bottom-color:var(--prim)}
main{max-width:1240px;margin:0 auto;padding:22px 16px 60px}
.cab-vista{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.cab-vista p{margin:4px 0 0;color:var(--tinta-3)}

/* ── Tarjetas ── */
.card{background:var(--superficie);border:1px solid var(--borde);border-radius:var(--radio);box-shadow:var(--sombra);padding:18px}
.card + .card{margin-top:16px}
.grid > .card + .card{margin-top:0}
.card-cab{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-panel{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
@media (max-width:900px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3,.g-panel,.g2{grid-template-columns:1fr}}
@media (max-width:480px){.g4{grid-template-columns:1fr 1fr}}
@media (max-width:370px){.g4{grid-template-columns:1fr}}

.kpi{padding:16px 18px}
.kpi .et{font-size:12.5px;color:var(--tinta-3);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.kpi .val{font-size:26px;font-weight:750;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .det{font-size:12.5px;color:var(--tinta-3);margin-top:2px}
.kpi.alerta .val{color:var(--rojo)}
.kpi.ok .val{color:var(--verde)}

/* ── Botones y formularios ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:9px;border:1px solid var(--borde);background:#fff;padding:9px 14px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--tinta);white-space:nowrap}
.btn:hover{background:var(--gris-bg)}
.btn.prim{background:var(--prim);border-color:var(--prim);color:#fff}
.btn.prim:hover{background:#186a2c}
.btn.azul{background:var(--azul);border-color:var(--azul);color:#fff}
.btn.wa{background:#1fa855;border-color:#1fa855;color:#fff}
.btn.wa:hover{background:#178f47}
.btn.peligro{color:var(--rojo);border-color:#f0c3bf}
.btn.peligro:hover{background:var(--rojo-bg)}
.btn.chico{padding:6px 10px;font-size:12.5px;border-radius:7px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap}
label.campo{display:block}
label.campo > span{display:block;font-size:12.5px;font-weight:600;color:var(--tinta-2);margin-bottom:5px}
.inp{width:100%;border:1px solid var(--gris-2);border-radius:9px;padding:9px 11px;background:#fff;outline:none;min-height:40px}
.inp:focus{border-color:var(--prim);box-shadow:0 0 0 3px rgba(0,0,204,.15)}
textarea.inp{min-height:70px;resize:vertical}
.form{display:grid;gap:12px}
.form.f2{grid-template-columns:1fr 1fr}
.form.f3{grid-template-columns:repeat(3,1fr)}
@media (max-width:640px){.form.f2,.form.f3{grid-template-columns:1fr}}
.full{grid-column:1/-1}
.ayuda{font-size:12px;color:var(--tinta-3);margin-top:4px}
.seg{display:inline-flex;background:var(--gris-bg);padding:3px;border-radius:10px;gap:2px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:8px;font-weight:600;color:var(--tinta-2);cursor:pointer}
.seg button.activo{background:#fff;color:var(--tinta);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--borde);background:#fff;border-radius:99px;padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--tinta-2)}
.chip.activo{background:var(--prim);border-color:var(--prim);color:#fff}
.chip .n{opacity:.75;margin-left:4px}

/* ── Tablas ── */
.tabla-wrap{overflow-x:auto;border:1px solid var(--borde);border-radius:10px}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--tinta-3);background:#fafbfa;padding:10px 12px;border-bottom:1px solid var(--borde);white-space:nowrap}
table.t td{padding:10px 12px;border-bottom:1px solid #eef0ee;vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t tr.clic{cursor:pointer}
table.t tr.clic:hover td{background:#f6faf7}
table.t .r{text-align:right;white-space:nowrap}
table.t tr.anulado td{color:var(--tinta-3);text-decoration:line-through}

/* ── Estados ── */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:650;white-space:nowrap}
.badge::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}
.b-ok{background:var(--verde-bg);color:var(--verde)}
.b-deuda{background:var(--rojo-bg);color:var(--rojo)}
.b-parcial{background:var(--ambar-bg);color:var(--ambar)}
.b-ret{background:var(--gris-bg);color:var(--gris)}
.b-azul{background:var(--azul-bg);color:var(--azul)}

/* ── Matriz de meses ── */
.matriz{display:grid;grid-template-columns:48px repeat(12,minmax(0,1fr));gap:4px;align-items:stretch}
.matriz .anio{font-weight:700;font-size:12.5px;color:var(--tinta-2);display:flex;align-items:center}
.matriz .mcab{font-size:11px;text-transform:uppercase;color:var(--tinta-3);text-align:center;font-weight:600}
.mes{border-radius:7px;min-height:42px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11.5px;font-weight:650;border:1px solid transparent;position:relative;font-variant-numeric:tabular-nums;padding:2px}
.mes small{font-size:9.5px;font-weight:600;opacity:.85}
.m-pagado{background:#c6e0b4;color:#1d4f1f;border-color:#a9cf93}
.m-adelantado{background:#d6ecc8;color:#1d4f1f;border:1px dashed #74b057}
.m-parcial{background:var(--ambar-bg);color:var(--ambar);border-color:#f2cf8f}
.m-pendiente{background:var(--rojo-bg);color:var(--rojo);border-color:#f3c1bc}
.m-nosocio{background:#acb9ca;color:#415062;opacity:.75}
.m-exento{background:var(--azul-bg);color:var(--azul);border-color:#bcd0f1}
.m-encurso{background:#fff;color:var(--tinta-2);border:1.5px dashed var(--verde-2)}
.m-futuro{background:#fafbfa;color:#b0b6bd;border-color:#eceeed}
.matriz.compacta .mes{min-height:30px;font-size:12px}
.mes.sel{outline:3px solid var(--azul);outline-offset:1px}
.mes.selec{cursor:pointer}
.leyenda{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:12px;color:var(--tinta-2)}
.leyenda i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-3px;margin-right:5px}
@media (max-width:640px){
  .matriz{grid-template-columns:repeat(6,minmax(0,1fr))}
  .matriz .mcab{display:none}
  .matriz .anio{grid-column:1/-1;margin-top:6px}
  .mes{min-height:44px}
  .mes::before{content:attr(data-m);font-size:9.5px;text-transform:uppercase;opacity:.8}
}

/* ── Login / consulta ── */
.portada{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:36px 16px;background:linear-gradient(180deg,var(--cielo) 0,var(--fondo) 340px)}
.portada .logo{width:130px;height:130px;border-radius:24px;background:#fff;object-fit:contain;padding:6px;box-shadow:0 6px 24px rgba(0,0,40,.14)}
.portada h1{font-size:22px;text-align:center;margin:14px 0 4px;color:var(--prim)}
.portada .lema{color:var(--tinta-2);text-align:center;margin-bottom:22px}
.acceso{width:100%;max-width:440px}
.acceso .seg{width:100%;margin-bottom:14px}
.acceso .seg button{flex:1}
.resultado-consulta{width:100%;max-width:880px;margin-top:20px}
.hero-deuda{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.hero-deuda .monto{font-size:38px;font-weight:800;font-variant-numeric:tabular-nums}
.hero-deuda .monto.ok{color:var(--verde)}
.hero-deuda .monto.mal{color:var(--rojo)}

/* ── Modal ── */
.modal-fondo{position:fixed;inset:0;background:rgba(15,25,18,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:28px 12px;overflow-y:auto}
.modal{background:#fff;border-radius:14px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:sube .16s ease-out}
.modal.ancho{max-width:980px}
.modal-cab{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 20px;border-bottom:1px solid var(--borde)}
.modal-cuerpo{padding:18px 20px}
.modal-pie{padding:14px 20px;border-top:1px solid var(--borde);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.cerrar{border:0;background:var(--gris-bg);width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer;flex:none}
@keyframes sube{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}

/* ── Avisos ── */
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;width:calc(100% - 32px);max-width:520px;pointer-events:none}
.toast{background:#17231b;color:#fff;padding:11px 16px;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.25);font-weight:550;pointer-events:auto;animation:sube .16s ease-out}
.toast.error{background:var(--rojo)}
.toast.ok{background:var(--verde)}
.cargando{position:fixed;top:0;left:0;height:3px;background:var(--amarillo);z-index:90;animation:carga 1.1s ease-in-out infinite;width:40%}
@keyframes carga{0%{left:-40%}100%{left:100%}}
.vacio{padding:26px;text-align:center;color:var(--tinta-3)}
.aviso{padding:11px 14px;border-radius:10px;background:var(--ambar-bg);color:#6d4300;font-size:13px;margin-bottom:14px}
.aviso.info{background:var(--azul-bg);color:#17448a}
.aviso.ok{background:var(--verde-bg);color:#17512a}

/* ── Buscador socio ── */
.buscador{position:relative}
.sugerencias{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:#fff;border:1px solid var(--borde);border-radius:10px;box-shadow:var(--sombra);max-height:300px;overflow-y:auto;z-index:30}
.sugerencias div{padding:9px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.sugerencias div:hover,.sugerencias div.foco{background:var(--verde-bg)}

/* ── Asignación de pago ── */
.asig{display:flex;flex-wrap:wrap;gap:6px}
.asig span{background:var(--verde-bg);border:1px solid var(--verde-borde);color:#17512a;border-radius:8px;padding:5px 9px;font-size:12.5px;font-weight:600}
.asig span.parcial{background:var(--ambar-bg);border-color:#f2cf8f;color:var(--ambar)}
.resumen-linea{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--borde)}
.resumen-linea:last-child{border-bottom:0}
.check-meses{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px;max-height:260px;overflow-y:auto;padding:2px}
.check-meses label{display:flex;gap:7px;align-items:center;border:1px solid var(--borde);border-radius:8px;padding:7px 9px;font-size:12.5px;cursor:pointer}
.check-meses label.pend{border-color:#f3c1bc;background:#fff8f7}

/* ── Gráficos ── */
.barras{position:relative;display:flex;align-items:flex-end;gap:4px;height:190px;padding:8px 0 0;border-bottom:1px solid var(--gris-2)}
.barras .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;position:relative;cursor:default}
.barras .col .b{background:var(--verde-2);border-radius:4px 4px 0 0;min-height:2px;transition:filter .1s}
.barras .col:hover .b{filter:brightness(.88)}
.barras .col.actual .b{background:repeating-linear-gradient(135deg,#8fcf9f 0 4px,#b9e2c2 4px 8px)}
.barras .guia{position:absolute;left:0;right:0;border-top:1px dashed #e3e6e4;pointer-events:none}
.barras .guia span{position:absolute;right:100%;margin-right:4px;top:-8px;font-size:10.5px;color:var(--tinta-3)}
.ejes{display:flex;gap:4px;margin-top:5px}
.ejes span{flex:1;text-align:center;font-size:10.5px;color:var(--tinta-3);text-transform:capitalize}
.graf-wrap{padding-left:34px}
.tip{position:fixed;z-index:70;background:#17231b;color:#fff;font-size:12px;padding:8px 10px;border-radius:8px;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:240px}
.tramo{display:grid;grid-template-columns:92px 1fr 34px;align-items:center;gap:10px;margin:9px 0;font-size:13px}
.tramo .pista{background:var(--gris-bg);border-radius:6px;height:14px;overflow:hidden}
.tramo .relleno{height:100%;border-radius:0 4px 4px 0}
.lista-morosos .fila{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #eef0ee;gap:8px;cursor:pointer}
.lista-morosos .fila:last-child{border-bottom:0}
.lista-morosos .fila:hover{color:var(--verde)}

@media print{.top,.nav,.btn,.btns{display:none!important}main{padding:0}.card{box-shadow:none}}
body.rol-consulta .solo-edita{display:none!important}
body:not(.rol-admin) .solo-admin{display:none!important}
body:not(.rol-admin):not(.rol-turno) .nav-turnos{display:none!important}
body.rol-turno .nav button:not(.nav-turnos):not([data-vista=config]){display:none!important}
</style>

</head>
<body>
  <!-- ═══════════ Ingreso ═══════════ -->
  <section id="portada" class="portada">
    <img class="logo" src="../assets/img/logo-96.png" alt="Logo ABPA">
    <h1>Asociación de Básquetbol<br>Punta Arenas</h1>
    <div class="lema">Informe de turno · ingresa con tu usuario para informar el partido</div>
    <div class="acceso card">
      <h2 style="text-align:center;margin:0 0 16px">Ingreso turnos</h2>
      <form id="f-login" class="form">
        <label class="campo"><span>Usuario</span><input class="inp" name="usuario" autocomplete="username" required></label>
        <label class="campo"><span>Clave</span><input class="inp" name="clave" type="password" autocomplete="current-password" required></label>
        <button class="btn prim" type="submit">Ingresar</button>
      </form>
    </div>
    <p style="margin-top:18px;text-align:center;font-size:13px;line-height:1.7"><b>Tip:</b> en el celular usa «Agregar a pantalla de inicio» para tenerlo como app.<br><a href="../">← Volver al sitio</a> · <a href="../panel/">Ingreso dirigentes</a></p>
  </section>

  <!-- ═══════════ Aplicación interna ═══════════ -->
  <section id="app" class="oculto">
    <header class="top">
      <div class="top-in">
        <img src="../assets/img/logo-96.png" alt="">
        <div class="marca">ABPA<small>Informe de turno</small></div>
        <div class="usuario"><b id="u-nombre"></b><span id="u-rol"></span></div>
        <button class="salir" id="btn-salir" type="button">Salir</button>
      </div>
    </header>
    <nav class="nav"><div class="nav-in">
      <button data-vista="inicio" class="activo">Inicio</button>
      <button data-vista="partidos">Partidos <span class="nav-badge oculto" id="badge-partidos"></span></button>
      <button data-vista="tabla">Posiciones</button>
      <button data-vista="turnos" class="nav-turnos">Informes de turno <span class="nav-badge oculto" id="badge-turnos"></span></button>
      <button data-vista="clubes">Clubes</button>
      <button data-vista="categorias">Categorías</button>
      <button data-vista="noticias">Noticias</button>
      <button data-vista="eventos">Actividades</button>
      <button data-vista="galeria">Galería</button>
      <button data-vista="documentos">Documentos</button>
      <button data-vista="mensajes">Mensajes <span class="nav-badge oculto" id="badge-mensajes"></span></button>
      <button data-vista="textos">Textos y directiva</button>
      <button data-vista="config">Configuración</button>
    </div></nav>
    <main id="vista"></main>
  </section>

  <div id="modal-raiz"></div>
  <div id="toast"></div>
  <div id="cargando" class="cargando oculto"></div>

  <script>window.ABPA_IMG = { logo: "../assets/img/logo-400.png", bandera: "../assets/img/bandera-magallanes.png" };</script>
  <script>
/* Conecta el panel con el sistema (Google Apps Script) usando la URL de assets/config.js */
(function () {
  var API = (window.ABPA_CONFIG || {}).API_URL || '';
  var LECTURA = /^api(Ingresar|Inicio|Datos|SitioDatos|SitioPendientes|Usuarios|RespaldoSitio)$/;
  function nuevoId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 10); }
  function llamar(fn, args, ok, ko, intento, rid) {
    intento = intento || 1; rid = rid || nuevoId();
    if (!/^https?:\/\//.test(API)) { if (ko) ko(new Error('Falta configurar API_URL en assets/config.js')); return; }
    var ctrl = window.AbortController ? new AbortController() : null;
    var t = setTimeout(function () { if (ctrl) ctrl.abort(); }, 90000);

  function campoHTML(c, val) {
    var n = c[0], et = c[1], tipo = c[2], full = ['textarea', 'textarea-lg', 'foto', 'logo', 'archivo'].indexOf(tipo) >= 0 || c[4] ? ' full' : '';

    else if (tipo === 'select') h += '<select class="inp" name="' + n + '"><option value="">—</option>' + c[3].map(function (o) {
      var v = Array.isArray(o) ? o[0] : o, t = Array.isArray(o) ? o[1] : o;
      return '<option value="' + esc(v) + '"' + (String(v) === String(val) ? ' selected' : '') + '>' + esc(t) + '</option>';
    }).join('') + '</select>';
    else if (tipo === 'sino') h = '<label class="campo full" style="display:flex;gap:8px;align-items:center"><input type="checkbox" name="' + n + '"' + (sino(val) ? ' checked' : '') + '> ' + et;

        (val ? '<img src="' + img(val, 300) + '" alt="">' : '<div class="vacia">Sin imagen</div>') +
        '<div class="btns"><label class="btn chico" style="cursor:pointer">Subir imagen<input type="file" accept="image/*" hidden></label>' + (val ? '<button type="button" class="btn chico peligro" data-quitar>Quitar</button>' : '') + '</div></div></div>';
    } else if (tipo === 'archivo') {
      return '<div class="campo full"><span style="display:block;font-size:12.5px;font-weight:600;color:var(--tinta-2);margin-bottom:5px">' + et + '</span><div class="st-foto" data-archivo="' + n + '"><input type="hidden" name="' + n + '" value="' + esc(val) + '">' +
        '<span class="estado-arch small">' + (val ? '✓ Archivo cargado · <a href="https://drive.google.com/file/d/' + esc(val) + '/view" target="_blank" rel="noopener">ver</a>' : 'Sin archivo') + '</span>' +
        '<label class="btn chico" style="cursor:pointer">' + (val ? 'Reemplazar' : 'Subir archivo') + '<input type="file" accept=".pdf,.doc,.docx,.xls,.xlsx,application/pdf" hidden></label></div></div>';
    } else h += '<input class="inp" name="' + n + '" type="' + tipo + '" value="' + esc(val) + '"' + (tipo === 'number' ? ' min="0" step="1"' : '') + '>';

  function activarFotos(raiz) {
    $$('[data-foto]', raiz).forEach(function (box) {
      var inp = $('input[type=hidden]', box), esLogo = box.hasAttribute('data-logo');
      var pintar = function (id) {
        inp.value = id;
        var vis = box.querySelector('img, .vacia');
        var nuevo = document.createElement(id ? 'img' : 'div');
        if (id) nuevo.src = img(id, 300); else { nuevo.className = 'vacia'; nuevo.textContent = 'Sin imagen'; }
        vis.replaceWith(nuevo);
      };
      $('input[type=file]', box).onchange = function (e) {
        var f = e.target.files[0]; if (!f) return;
        C.toast('Subiendo imagen…');
        subirImagen(f, null, '', esLogo).then(function (r) { pintar(r.id); C.toast('Imagen cargada.', 'ok'); }).catch(C.fallo);
      };
      var q = $('[data-quitar]', box); if (q) q.onclick = function () { pintar(''); q.remove(); };
    });
    $$('[data-archivo]', raiz).forEach(function (box) {
      var inp = $('input[type=hidden]', box), est = $('.estado-arch', box);
      $('input[type=file]', box).onchange = function (e) {
        var f = e.target.files[0]; if (!f) return;
        if (f.size > 15 * 1024 * 1024) { C.toast('El archivo pesa más de 15 MB. Comprímelo o súbelo a Drive y pega el enlace.', 'error'); return; }
        est.textContent = 'Subiendo ' + f.name + '…';
        var lector = new FileReader();
        lector.onload = function () {
          C.api('apiSubirDocumento', C.S.token, { base64: String(lector.result).split(',')[1], mime: f.type || 'application/pdf', nombre: f.name })
            .then(function (r) { inp.value = r.id; est.innerHTML = '✓ ' + esc(f.name); C.toast('Archivo cargado.', 'ok'); })
            .catch(function (err) { est.textContent = 'Sin archivo'; C.fallo(err); });
        };
        lector.readAsDataURL(f);
      };
    });
  }

  /** Reduce la imagen en el navegador y la sube a Drive. Los logos se guardan en PNG (conservan la transparencia). */
  function subirImagen(file, albumId, descripcion, esLogo) {
    return new Promise(function (ok, ko) {
      if (!/^image\//.test(file.type)) return ko(new Error('El archivo no es una imagen.'));
      var lector = new FileReader();
      lector.onerror = function () { ko(new Error('No se pudo leer la imagen.')); };
      lector.onload = function () {
        var im = new Image();
        im.onerror = function () { ko(new Error('Formato de imagen no soportado (usa JPG o PNG).')); };
        im.onload = function () {
          var max = esLogo ? 600 : 1600, w = im.width, h = im.height, k = Math.min(1, max / Math.max(w, h));
          var cv = document.createElement('canvas'); cv.width = Math.round(w * k); cv.height = Math.round(h * k);
          var cx = cv.getContext('2d');
          if (!esLogo) { cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height); }
          cx.drawImage(im, 0, 0, cv.width, cv.height);
          var mime = esLogo ? 'image/png' : 'image/jpeg';
          var b64 = cv.toDataURL(mime, 0.85).split(',')[1];
          C.api('apiSubirFoto', C.S.token, { base64: b64, mime: mime, nombre: file.name.replace(/\.\w+$/, '') + (esLogo ? '.png' : '.jpg'), albumId: albumId || null, descripcion: descripcion || '' }).then(ok, ko);
        };
        im.src = lector.result;
      };
      lector.readAsDataURL(file);
    });
  }

  function formRegistro(hoja, reg, despues, base) {
    var d = DEF[hoja], nuevo = !reg, campos = d.campos();
    reg = reg || {};
    var vals = {};
    campos.forEach(function (c) {
      var k = c[0];
      vals[k] = reg[k] != null && reg[k] !== '' ? reg[k] : (nuevo ? ((base || {})[k] != null ? base[k] : c[2] === 'date' ? hoy() : DEFECTOS[k]) : reg[k]);
    });
    var m = C.modal('<h3>' + (nuevo ? 'Nuevo/a ' : 'Editar ') + d.uno + '</h3>', '<form class="form f2" id="fr-reg">' + campos.map(function (c) { return campoHTML(c, vals[c[0]]); }).join('') + '</form>',
      (!nuevo && hoja === 'Partidos' ? '<button class="btn peligro" data-del style="margin-right:auto">Eliminar partido</button>' : '') +
      '<button class="btn" data-no>Cancelar</button><button class="btn prim" data-ok>Guardar</button>', { ancho: hoja === 'Noticias' || hoja === 'Clubes' });
    var f = $('#fr-reg', m);
    activarFotos(m);
    if (hoja === 'Partidos') {
      // Al elegir el local se propone su gimnasio
      f.LocalID.onchange = function () { if (!f.Recinto.value) { var c = club(f.LocalID.value); f.Recinto.value = c.Recinto || ''; } };
    }
    $('[data-no]', m).onclick = m.cerrar;
    var bdel = $('[data-del]', m);
    if (bdel) bdel.onclick = function () {
      eliminar('Partidos', reg.ID, (reg.Numero ? 'N° ' + reg.Numero + ' · ' : '') + club(reg.LocalID).Nombre + ' vs ' + club(reg.VisitaID).Nombre + ' (' + C.fechaCL(reg.Fecha) + ')');
    };
    $('[data-ok]', m).onclick = function () {
      var datos = { ID: reg.ID || null };
      campos.forEach(function (c) { var el = f.elements[c[0]]; datos[c[0]] = c[2] === 'sino' ? (el.checked ? 'SI' : 'NO') : el.value; });
      var b = this; b.disabled = true;
      C.api('apiGuardarRegistro', C.S.token, hoja, datos).then(function (r) { C.toast(r.mensaje, 'ok'); m.cerrar(); if (despues) despues(r); else recargar(); })
        .catch(C.fallo).then(function () { b.disabled = false; });
    };
  }

  function eliminar(hoja, id, nombre) {

    });

    $$('[data-borrar]', cont).forEach(function (x) { x.onclick = function () { eliminar(x.dataset.borrar.split(':')[0], +x.dataset.borrar.split(':')[1], x.dataset.nombre); }; });

  function filaPartido(p, editable) {

      : (jugado ? esc(pl) + ' – ' + esc(pv) : /^W\.O/.test(p.Estado) ? 'W.O.' : '<span class="muted" style="font-size:13px;font-weight:600">vs</span>');
    var estados = D.estados.map(function (e) { return '<option' + (e === (p.Estado || 'Programado') ? ' selected' : '') + '>' + e + '</option>'; }).join('');
    return '<div class="pt' + (sinResultado(p) ? ' pend' : '') + '" data-pid="' + p.ID + '"><div class="cuando"><b>' + C.fechaCL(p.Fecha) + '</b>' + (p.Hora ? p.Hora + ' h' : 'Hora por definir') + (p.Numero ? '<span class="muted"> · N° ' + p.Numero + '</span>' : '') + '</div>' +
      '<div class="vs"><div class="eq' + (gL ? ' gana' : '') + '">' + logo(L, 30) + '<span>' + esc(L.Nombre) + '</span></div><div class="marc">' + marc + '</div><div class="eq v' + (gV ? ' gana' : '') + '"><span>' + esc(V.Nombre) + '</span>' + logo(V, 30) + '</div></div>' +
      '<div class="acc">' + (editable && C.puede() ? '<select class="inp" data-est>' + estados + '</select><button class="btn chico prim" data-guardar>Guardar</button>' : '<span class="badge ' + (jugado || /^W/.test(p.Estado) ? 'b-ok' : p.Estado === 'Programado' || !p.Estado ? 'b-azul' : 'b-parcial') + '">' + esc(p.Estado || 'Programado') + '</span>') +

          (largo ? '<textarea class="inp" name="' + esc(t.Clave) + '" style="min-height:' + (t.Clave === 'NOSOTROS' ? 200 : 90) + 'px">' + esc(t.Valor) + '</textarea>' : '<input class="inp" name="' + esc(t.Clave) + '" value="' + esc(t.Valor) + '">') + '</label>';
      }).join('') + '</form><div class="btns solo-edita" style="margin-top:14px"><button class="btn prim" data-guardar>Guardar textos</button></div></div>' +
      '<div class="card"><div class="card-cab"><div><h3>Copia de respaldo del sitio</h3><div class="muted small">Es lo que ven al instante quienes entran por primera vez (y lo que se muestra si Google no responde). ' +
      'Descárgala después de cambios importantes y súbela a GitHub en la carpeta <b>assets</b>, reemplazando <b>contenido-base.json</b>.</div></div>' +
      '<button class="btn" id="btn-respaldo">Descargar contenido-base.json</button></div></div>';
    enlazar(v, 'Directiva', D.directiva);
    $('#btn-respaldo', v).onclick = function () {
      C.api('apiRespaldoSitio', C.S.token).then(function (d) {
        var a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([JSON.stringify(d)], { type: 'application/json' }));
        a.download = 'contenido-base.json';
        document.body.appendChild(a); a.click(); a.remove();
        C.toast('Copia descargada. Súbela a GitHub en la carpeta assets.', 'ok');
      }).catch(C.fallo);
    };
    $$('[data-guardar]', v).forEach(function (b) {
      b.onclick = function () {
        var f = $('#f-textos', v), vals = {};
        D.textos.forEach(function (t) { vals[t.Clave] = f.elements[t.Clave].value; });
        C.api('apiGuardarTextos', C.S.token, vals).then(function (r) { C.toast(r.mensaje, 'ok'); }).catch(C.fallo);
      };
    });
  });

  // ─── Avisos en el menú ───
  function pintarBadge(id, n) { var b = document.getElementById(id); if (!b) return; b.textContent = n; b.classList.toggle('oculto', !n); }
  function actualizarBadges() {
    if (!D) return;
    pintarBadge('badge-partidos', D.partidos.filter(sinResultado).length);
    pintarBadge('badge-mensajes', D.mensajes.filter(function (m) { return m.Estado === 'Nuevo'; }).length);
  }
  function refrescarBadges() {
    C.api('apiSitioPendientes', C.S.token).then(function (r) { pintarBadge('badge-partidos', r.sinResultado); pintarBadge('badge-mensajes', r.mensajes); }).catch(function () { });
  }

  var V = C.vistas;
  V.inicio = vistaInicio; V.partidos = vistaPartidos; V.tabla = vistaTabla; V.clubes = vistaClubes; V.categorias = vistaCategorias;
  V.noticias = vistaNoticias; V.eventos = vistaEventos; V.galeria = vistaGaleria; V.documentos = vistaDocumentos; V.mensajes = vistaMensajes; V.textos = vistaTextos;
  window.ABPA_PANEL = { alEntrar: refrescarBadges };
})();

<script>
(function () {
  'use strict';
  var C = window.ABPA;
  if (!C) return;
  var $ = C.$, $$ = C.$$, esc = C.esc;
  var IMG = window.ABPA_IMG || { logo: '', bandera: '' };

  var T = { d: null, v: null, tab: 'pend', form: null, filt: { serie: '', fase: '', q: '' }, adm: 'arbitros', todos: false, fotos: {}, log: null, flushing: false };

  // ════════════════ Utilidades ════════════════
  function cfg() { return (C.S.datos && C.S.datos.config) || {}; }
  function usuario() { return C.S.datos.sesion.usuario; }
  function esAdmin() { return C.S.datos && C.S.datos.sesion.rol === 'admin'; }
  function activa() { return C.S.vista === 'turnos' && T.v; }
  function offline() { return typeof navigator !== 'undefined' && navigator.onLine === false; }
  function p2(n) { return (n < 10 ? '0' : '') + n; }
  function ftMs(ms) { var d = new Date(ms); return p2(d.getDate()) + '/' + p2(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes()); }
  function ftEnvio(s) { var m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})/); return m ? m[3] + '/' + m[2] + '/' + m[1] + ' ' + m[4] + ':' + m[5] : String(s || ''); }
  function nuevoCid() { return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10); }
  function num(v) { if (v === '' || v == null) return null; var n = Number(v); return Number.isInteger(n) && n >= 0 ? n : NaN; }
  function rel(fecha) {
    var hoy = T.d ? T.d.hoy : '', f = new Date(hoy + 'T12:00:00');
    function iso(o) { var x = new Date(f.getTime() + o * 864e5); return x.getFullYear() + '-' + p2(x.getMonth() + 1) + '-' + p2(x.getDate()); }
    return fecha === hoy ? 'Hoy' : fecha === iso(1) ? 'Mañana' : fecha === iso(-1) ? 'Ayer' : C.fechaCL(fecha);
  }
  function fechaEtq(fase) { var m = String(fase || '').match(/^\s*fecha\s*(\d+)\s*$/i); return m ? ['FECHA N°', m[1]] : ['FASE', fase || '—']; }
  function oficial(i) {
    var wo = Number(cfg().MARCADOR_WO); if (isNaN(wo)) wo = 20;
    if (i.wo === 'L') return [0, wo];
    if (i.wo === 'V') return [wo, 0];
    return [i.pl, i.pv];
  }
  function absUrl(u) { try { return new URL(u, document.baseURI).href; } catch (e) { return u; } }

  // ════════════════ Cola de envío (funciona sin señal) ════════════════
  function kCola() { return 'abpa_turnos_cola_' + usuario(); }
  function kBorr() { return 'abpa_turnos_borrador_' + usuario(); }
  function kCache() { return 'abpa_turnos_cache_' + usuario(); }
  function lee(k, def) { try { var r = localStorage.getItem(k); return r ? JSON.parse(r) : def; } catch (e) { return def; } }
  function escribe(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
  function cola() { return lee(kCola(), []); }
  function guardaCola(a) { if (!escribe(kCola(), a)) C.toast('No hay espacio en el teléfono para guardar el informe pendiente. Envíalo con señal.', 'error'); actualizarBadge(); }
  function actualizarBadge() {
    var b = document.getElementById('badge-turnos'); if (!b || !C.S.datos) return;
    var n = cola().length; b.textContent = n; b.classList.toggle('oculto', !n);
  }
  function enCola(partidoId) { return cola().filter(function (x) { return x.payload.partidoId === partidoId; })[0]; }

  var timerCola = null;
  function programarCola() {
    clearTimeout(timerCola);
    if (!C.S.token || !cola().some(function (x) { return x.estado !== 'error'; })) return;
    timerCola = setTimeout(function () { vaciarCola(); }, 20000);
  }
  /** Intenta enviar todo lo pendiente, uno por uno. Es seguro repetirlo: el servidor reconoce el mismo informe por su identificador. */
  function vaciarCola(manual) {
    if (T.flushing || !C.S.token || !C.S.datos) return Promise.resolve();
    var items = cola().filter(function (x) { return manual ? true : x.estado !== 'error'; });
    if (!items.length) return Promise.resolve();
    if (offline()) { if (manual) C.toast('Sigues sin señal. El informe está guardado en este teléfono y se enviará solo.', 'error'); programarCola(); return Promise.resolve(); }
    T.flushing = true;
    var enviados = 0, fallos = 0;
    function marca(cid, cambios) { var a = cola(); a.forEach(function (x) { if (x.cid === cid) Object.keys(cambios).forEach(function (k) { x[k] = cambios[k]; }); }); guardaCola(a); }
    function uno(i) {
      if (i >= items.length) return Promise.resolve();
      var it = items[i];
      marca(it.cid, { estado: 'enviando', error: '' }); if (activa()) pintar();
      return new Promise(function (res) {
        google.script.run.withSuccessHandler(function (r) { res({ ok: true, r: r }); }).withFailureHandler(function (e) { res({ ok: false, e: e }); }).apiTurnoEnviar(C.S.token, it.payload);
      }).then(function (x) {
        if (x.ok) { enviados++; guardaCola(cola().filter(function (y) { return y.cid !== it.cid; })); return uno(i + 1); }
        var msg = String((x.e && x.e.message) || x.e || '').replace(/^(Error|Exception):\s*/, '');
        var transitorio = (x.e && x.e.red) || /conexi|confirmaci|ocupado|procesando|sesi[oó]n|SESION/i.test(msg);
        if (transitorio) { marca(it.cid, { estado: 'pendiente' }); fallos++; return Promise.resolve(); }
        marca(it.cid, { estado: 'error', error: msg }); fallos++;
        return uno(i + 1);
      });
    }
    return uno(0).then(function () {
      T.flushing = false;
      if (enviados) { C.toast(enviados === 1 ? 'Informe enviado. Ya se ve en el sitio y en la tabla.' : enviados + ' informes enviados.', 'ok'); }
      if (fallos && !enviados && manual) C.toast('No se pudo enviar todavía. Quedó guardado y se reintenta solo.', 'error');
      return cargar().catch(function () { }).then(function () { if (activa()) pintar(); programarCola(); });
    });
  }

  // ════════════════ Datos ════════════════
  function cargar() {
    return C.api('apiTurnoDatos', C.S.token, esAdmin() && T.todos).then(function (d) {
      T.d = d; escribe(kCache(), d); actualizarBadge(); return d;
    }, function (e) {
      if (!T.d) { var c = lee(kCache(), null); if (c) { T.d = c; T.sinRed = true; } }
      throw e;
    });
  }

  // ════════════════ Pantalla principal ════════════════
  function vistaTurnos(v) {
    T.v = v; v.classList.add('tn');
    v.onclick = clic; v.oninput = entrada; v.onchange = cambio;
    if (!T.d) v.innerHTML = '<div class="vacio">Cargando…</div>';
    else pintar();
    cargar().then(function () { T.sinRed = false; if (activa()) pintar(); }).catch(function (e) {
      if (!activa()) return;
      if (T.d) { pintar(); C.toast('Sin conexión: se muestran los últimos datos guardados en este teléfono.', 'error'); } else C.fallo(e);
    });
    vaciarCola();
  }

  function pintar() {
    if (!activa()) return;
    var pend = cola().length;
    var cab = '<div class="cab-vista"><div><h2>Informes de turno</h2><p>' + (T.form ? 'Completa el informe al terminar el partido.' : 'Elige tu partido, completa el informe y envíalo. El resultado se publica solo.') + '</p></div>' +
      '<div class="tn-net ' + (offline() ? 'off' : '') + '"><i></i>' + (offline() ? 'Sin señal' + (pend ? ' · ' + pend + ' pendiente' + (pend > 1 ? 's' : '') : '') : pend ? pend + ' pendiente' + (pend > 1 ? 's' : '') + ' de envío' : 'En línea') + '</div></div>';
    var cuerpo;
    if (T.form) cuerpo = pForm();
    else {
      var tabs = [['pend', 'Por informar'], ['inf', 'Informes']].concat(esAdmin() ? [['adm', 'Administración']] : []);
      cuerpo = '<div class="seg tn-tabs">' + tabs.map(function (t) { return '<button data-tn="tab" data-t="' + t[0] + '" class="' + (T.tab === t[0] ? 'activo' : '') + '">' + t[1] + '</button>'; }).join('') + '</div>' +
        (T.tab === 'pend' ? pPend() : T.tab === 'inf' ? pInformes() : pAdmin());
    }
    T.v.innerHTML = cab + cuerpo;
    if (T.form) derivado();
    if (!T.form && T.tab === 'inf') listaInformes();
    if (!T.form && T.tab === 'adm' && T.adm === 'log') cargarLog();
  }

  // ─── Por informar ───
  function filaPartido(m, boton) {
    return '<div class="tn-m"><div class="tn-n">' + esc(m.Numero) + '</div><div><div class="tn-vs">' + esc(m.Local) + '<i>vs</i>' + esc(m.Visita) + '</div>' +
      '<div class="tn-sub"><span class="badge b-azul">' + esc(m.Serie) + '</span><span>' + esc(rel(m.Fecha)) + (m.Hora ? ' · ' + esc(m.Hora) + ' h' : '') + '</span>' + (m.Recinto ? '<span>' + esc(m.Recinto) + '</span>' : '') + (m.Fase ? '<span>' + esc(m.Fase) + '</span>' : '') +
      (m.Estado && m.Estado !== 'Programado' ? '<span class="badge b-parcial">' + esc(m.Estado) + '</span>' : '') + '</div></div><div class="tn-acc">' + (boton || '') + '</div></div>';
  }
  function pPend() {
    var d = T.d, mias = d.informes.filter(function (i) { return i.respUsuario === usuario(); }).length, pend = cola();
    var lista = d.porInformar.filter(function (m) { return !enCola(m.ID); });
    var hoy = lista.filter(function (m) { return m.Fecha === d.hoy; }).length;
    return '<div class="tn-kpis">' +

    return '<div class="acta"><div class="ah"><img src="' + esc(IMG.logo) + '" alt=""><div class="at"><b>' + esc(p.enc1) + '</b><b>' + esc(p.enc2) + '</b><u>INFORME DE TURNO</u></div><img src="' + esc(IMG.bandera) + '" alt=""></div>' +
      '<div class="ag">' + caja(fe[0], fe[1]) + caja('FECHA', C.fechaCL(i.Fecha)) + caja('PARTIDO N°', i.Numero) + caja('HORA INICIO', i.inicio) + caja('SERIE', i.Serie) + caja('HORA FIN', i.fin) + '</div>' +
      '<div class="ag"><div class="af"><span>LOCAL</span><i class="largo">' + esc(i.Local) + '</i></div><div class="af"><span>VISITA</span><i class="largo">' + esc(i.Visita) + '</i></div>' +
      '<div class="af"><span>RESULTADO</span><i>' + of[0] + '</i></div><div class="af"><span>RESULTADO</span><i>' + of[1] + '</i></div></div>' +
      (wo ? '<p class="aw"><b>W.O.:</b> resultado oficial por no presentación o incumplimiento del mínimo de jugadores.' + (i.pl != null && i.pv != null ? ' Marcador jugado: ' + i.pl + ' – ' + i.pv + '.' : '') + '</p>' : '') +
      '<div class="ag uno">' + lin('ÁRBITRO 1', i.arb1) + lin('ÁRBITRO 2', i.arb2) + lin('ANOTADOR', i.anot) + lin('CRONOMETRISTA', i.crono) + lin('PLANILLERO', i.plan) + lin('RESP. TURNO', i.resp) + '</div>' +
      '<div class="al">OBSERVACIONES</div><div class="ab">' + esc(i.obs || 'Sin observaciones') + '</div>' +
      (fotoUrl ? '<div class="al">ACTA FIRMADA (ADJUNTA)</div><img class="afoto" src="' + fotoUrl + '" alt="Acta firmada">' : '') +
      '<div class="as"><b>FECHA Y FIRMA DEL TURNO RESPONSABLE</b><div class="nm">' + esc(i.resp) + '</div><small>' + esc(ftEnvio(i.envio)) + ' · ' + esc(i.resp) + ' · ' + esc(p.pie) + '</small></div></div>';
  }
  function fotoDe(i) {
    if (!i.foto) return Promise.resolve('');
    if (T.fotos[i.ID]) return Promise.resolve(T.fotos[i.ID]);
    return C.api('apiTurnoFoto', C.S.token, i.ID).then(function (r) { return (T.fotos[i.ID] = 'data:' + r.mime + ';base64,' + r.base64); });
  }
  function verInforme(i) {
    var mo = C.modal('<h3>Informe del partido N° ' + esc(i.Numero) + '</h3>', '<div class="tn-papel" id="tn-acta">' + actaHtml(i, T.fotos[i.ID] || '') + '</div><div class="ayuda">Así se ve el informe. «Descargar PDF» abre la hoja lista para imprimir o guardar como PDF.</div>',
      '<button class="btn" data-no>Cerrar</button><button class="btn prim" data-pdf>Descargar PDF</button>', { ancho: true });
    $('[data-no]', mo).onclick = function () { mo.cerrar(); };
    if (i.foto && !T.fotos[i.ID]) fotoDe(i).then(function (u) { var a = $('#tn-acta', mo); if (a) a.innerHTML = actaHtml(i, u); }).catch(function () { });
    $('[data-pdf]', mo).onclick = function () { imprimir(i); };
  }
  function imprimir(i) {
    var w = window.open('', '_blank');
    if (!w) { C.toast('El navegador bloqueó la ventana. Permite las ventanas emergentes de este sitio e inténtalo de nuevo.', 'error'); return; }
    w.document.write('<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Informe de turno N° ' + esc(i.Numero) + ' - ' + esc(i.Serie) + '</title></head><body style="font-family:Arial;padding:24px">Preparando el informe…</body></html>');
    fotoDe(i).catch(function () { return ''; }).then(function (u) {
      var logo = absUrl(IMG.logo), band = absUrl(IMG.bandera);
      var html = actaHtml(i, u).replace(esc(IMG.logo), esc(logo)).replace(esc(IMG.bandera), esc(band));
      var css = ($('#tn-acta-css') || {}).textContent || '';
      w.document.open();
      w.document.write('<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Informe de turno N° ' + esc(i.Numero) + ' - ' + esc(i.Serie) + '</title><style>' + css +
        '@page{size:A4;margin:14mm}html,body{margin:0;background:#fff}.acta{border:0;max-width:none;min-width:0;padding:0}</style></head><body>' + html + '</body></html>');
      w.document.close();
      var imgs = Array.prototype.slice.call(w.document.images), n = imgs.length, listo = false;
      function lanzar() { if (listo) return; listo = true; try { w.focus(); w.print(); } catch (e) { } }
      if (!n) return lanzar();
      imgs.forEach(function (im) { if (im.complete) { if (!--n) lanzar(); } else { im.onload = im.onerror = function () { if (!--n) lanzar(); }; } });
      setTimeout(lanzar, 4000);
    });
  }

  // ─── Administración ───
  function pAdmin() {
    var subs = [['arbitros', 'Árbitros'], ['mesa', 'Mesa de control'], ['params', 'Parámetros'], ['log', 'Registro']];
    var atajos = '<div class="card" style="margin-bottom:16px"><h3 style="margin-bottom:6px">Fixture, series, equipos y usuarios</h3><p class="muted small" style="margin:0 0 10px">Son los mismos del resto del sistema, así que se cambian en sus secciones de siempre. El informe toma el partido (N°, fecha, hora, cancha), las series y los equipos desde ahí.</p>' +
      '<div class="btns"><button class="btn chico" data-tn="ir" data-v="partidos">Partidos y N° de partido</button><button class="btn chico" data-tn="ir" data-v="categorias">Series (categorías)</button><button class="btn chico" data-tn="ir" data-v="clubes">Equipos (clubes)</button><button class="btn chico" data-tn="ir" data-v="config">Usuarios de turno</button></div></div>';
    return atajos + '<div class="seg tn-tabs">' + subs.map(function (s) { return '<button data-tn="adm" data-t="' + s[0] + '" class="' + (T.adm === s[0] ? 'activo' : '') + '">' + s[1] + '</button>'; }).join('') + '</div>' +
      (T.adm === 'params' ? aParams() : T.adm === 'log' ? '<div class="card"><h3 style="margin-bottom:6px">Registro de movimientos</h3><div id="tn-log"><div class="vacio">Cargando…</div></div></div>' : aLista(T.adm === 'mesa' ? 'mesa' : 'arbitro'));
  }
  function aLista(tipo) {
    var L = tipo === 'mesa' ? T.d.mesa : T.d.arbitros, esArb = tipo === 'arbitro';
    return '<div class="card"><h3>' + (esArb ? 'Árbitros' : 'Mesa de control') + '</h3><p class="ayuda" style="margin:4px 0 10px">' +
      (esArb ? 'Lista del desplegable. La estrella (★) marca a quien quieras destacar. Los informes ya enviados conservan el nombre que tenían.' : 'Sugerencias para Anotador, Cronometrista y Planillero. El turno también puede escribir otro nombre.') + '</p>' +
      (L.length ? L.map(function (x) {
        return '<div class="tn-le"><input class="inp" data-le="' + x.ID + '" data-tipo="' + tipo + '" value="' + esc(x.Nombre) + '" aria-label="Nombre">' +
          (esArb ? '<label><input type="checkbox" data-lm="' + x.ID + '"' + (x.Marca ? ' checked' : '') + '> ★</label>' : '') +
          '<label><input type="checkbox" data-la="' + x.ID + '"' + (x.Activo ? ' checked' : '') + '> Activo</label><button class="btn chico peligro" data-tn="lquitar" data-id="' + x.ID + '">Quitar</button></div>';
      }).join('') : '<div class="vacio">Aún no hay nombres.</div>') +
      '<div class="btns" style="margin-top:12px"><input class="inp" id="tn-nuevo" placeholder="Apellido, Nombre" style="flex:1 1 220px;width:auto"><button class="btn prim" data-tn="lagregar" data-tipo="' + tipo + '">Agregar</button></div></div>';
  }
  function aParams() {
    var p = T.d.params;
    return '<div class="card"><h3 style="margin-bottom:12px">Parámetros del módulo</h3><form class="form" id="tn-par" onsubmit="return false">' +
      '<div class="form f3"><label class="campo"><span>Horas que el turno puede editar su informe</span><input class="inp" name="editarHoras" inputmode="numeric" value="' + esc(p.editarHoras) + '"><div class="ayuda">Se cuentan desde el envío. Después, solo el administrador.</div></label>' +
      '<label class="campo"><span>Partidos sin informe: días hacia atrás</span><input class="inp" name="diasAtras" inputmode="numeric" value="' + esc(p.diasAtras) + '"></label>' +
      '<label class="campo"><span>Partidos por informar: días hacia adelante</span><input class="inp" name="diasAdelante" inputmode="numeric" value="' + esc(p.diasAdelante) + '"></label></div>' +
      '<div class="form f2"><label class="campo"><span>Encabezado del informe, línea 1</span><input class="inp" name="enc1" value="' + esc(p.enc1) + '"></label><label class="campo"><span>Encabezado del informe, línea 2</span><input class="inp" name="enc2" value="' + esc(p.enc2) + '"></label></div>' +
      '<label class="campo"><span>Pie del informe</span><input class="inp" name="pie" value="' + esc(p.pie) + '"></label>' +
      '<label class="campo"><span>Texto de ayuda en Observaciones</span><textarea class="inp" name="ayudaObs">' + esc(p.ayudaObs) + '</textarea></label>' +
      '<div><button class="btn prim" data-tn="gparams">Guardar parámetros</button></div></form></div>';
  }
  function cargarLog() {
    C.api('apiTurnoLog', C.S.token).then(function (L) {
      var el = $('#tn-log', T.v); if (!el) return;
      el.innerHTML = L.length ? '<ul class="tn-log">' + L.map(function (l) { return '<li><time>' + esc(l.fecha) + '</time><span><b>' + esc(l.usuario) + '</b> · ' + esc(l.accion) + '</span></li>'; }).join('') + '</ul>' : '<div class="vacio">Sin movimientos todavía.</div>';
    }).catch(C.fallo);
  }

  // ════════════════ Eventos ════════════════
  function buscarInforme(id) { return T.d.informes.filter(function (i) { return i.ID === Number(id); })[0]; }
  function refrescar() { return cargar().then(function () { if (activa()) pintar(); }); }
  var ACCIONES = {
    tab: function (b) { T.tab = b.dataset.t; pintar(); },
    adm: function (b) { T.adm = b.dataset.t; pintar(); },
    ir: function (b) { C.irA(b.dataset.v); },
    informar: function (b) { var m = T.d.porInformar.filter(function (x) { return x.ID === Number(b.dataset.id); })[0]; if (m) iniciarForm(m); },
    cancelar: function () { guardarBorrador(); T.form = null; pintar(); window.scrollTo(0, 0); },
    stp: function (b) { var f = T.form, k = b.dataset.k, v = num(f.d[k]); f.d[k] = String(Math.max(0, (v == null || isNaN(v) ? 0 : v) + Number(b.dataset.d))); $('#f-' + k, T.v).value = f.d[k]; derivado(); guardarBorrador(); },
    ahora: function (b) { var k = b.dataset.k, d = new Date(); T.form.d[k] = p2(d.getHours()) + ':' + p2(d.getMinutes()); $('#f-' + k, T.v).value = T.form.d[k]; guardarBorrador(); },
    sinfoto: function () { var d = T.form.d; if (d.foto) d.foto = ''; else d.quitarFoto = true; guardarBorrador(); pintar(); },
    revisar: revisar,
    limpiar: function () { T.filt = { serie: '', fase: '', q: '' }; pintar(); },
    ver: function (b) { var i = buscarInforme(b.dataset.id); if (i) verInforme(i); },
    editar: function (b) {
      var i = buscarInforme(b.dataset.id); if (!i) return;
      if (!i.edita) { C.toast('Pasó el plazo de edición.', 'error'); return; }
      var m = { ID: i.PartidoID, Numero: i.Numero, Fecha: i.Fecha, Hora: '', Fase: i.FechaN, Recinto: '', Serie: i.Serie, Local: i.Local, Visita: i.Visita };
      var d = { inicio: i.inicio, fin: i.fin, pl: i.pl == null ? '' : String(i.pl), pv: i.pv == null ? '' : String(i.pv), woL: i.wo === 'L', woV: i.wo === 'V', arb1: i.arb1, arb2: i.arb2, anot: i.anot, crono: i.crono, plan: i.plan, obs: i.obs, foto: '', tieneFoto: !!i.foto, quitarFoto: false };
      iniciarForm(m, { d: d, editId: i.ID });
      T.form.respNombre = i.resp;
    },
    eliminar: function (b) {
      var i = buscarInforme(b.dataset.id); if (!i) return;
      C.confirmar('Eliminar informe', 'Se borra el informe del partido N° ' + esc(i.Numero) + ' (' + esc(i.Local) + ' vs ' + esc(i.Visita) + ') y el partido vuelve a quedar «Programado», sin marcador. En la tabla de posiciones dejará de contar.', 'Eliminar', true).then(function (ok) {
        if (!ok) return;
        C.api('apiTurnoEliminar', C.S.token, i.ID).then(function (r) { C.toast(r.mensaje, 'ok'); return refrescar(); }).catch(C.fallo);
      });
    },
    reintentar: function () { vaciarCola(true); },
    corregir: function (b) {
      var it = cola().filter(function (x) { return x.cid === b.dataset.cid; })[0]; if (!it) return;
      var p = it.payload;
      var d = { inicio: p.inicio, fin: p.fin, pl: p.pl === '' ? '' : String(p.pl), pv: p.pv === '' ? '' : String(p.pv), woL: p.wo === 'L', woV: p.wo === 'V', arb1: p.arb1, arb2: p.arb2, anot: p.anot, crono: p.crono, plan: p.plan, obs: p.obs,
        foto: p.foto ? 'data:' + p.foto.mime + ';base64,' + p.foto.base64 : '', tieneFoto: false, quitarFoto: false };
      iniciarForm(it.match, { d: d, cid: it.cid, reemplaza: it.cid });
    },
    descartar: function (b) {
      C.confirmar('Descartar informe sin enviar', 'Este informe todavía no llegó al sistema. Si lo descartas, se pierde y el partido seguirá sin informe. ¿Descartarlo?', 'Descartar', true).then(function (ok) {
        if (!ok) return; guardaCola(cola().filter(function (x) { return x.cid !== b.dataset.cid; })); pintar();
      });
    },
    lagregar: function (b) {
      var inp = $('#tn-nuevo', T.v), n = inp.value.trim(); if (!n) { C.toast('Escribe un nombre.', 'error'); return; }
      C.api('apiTurnoGuardarLista', C.S.token, { Tipo: b.dataset.tipo, Nombre: n, Marca: false, Activo: true }).then(function () { return refrescar(); }).catch(C.fallo);
    },
    lquitar: function (b) {
      var id = Number(b.dataset.id), x = T.d.arbitros.concat(T.d.mesa).filter(function (r) { return r.ID === id; })[0];
      C.confirmar('Quitar de la lista', '¿Quitar a «' + esc(x ? x.Nombre : '') + '»? Los informes ya enviados conservan el nombre. Si solo quieres que deje de aparecer, desmarca «Activo».', 'Quitar', true).then(function (ok) {
        if (!ok) return; C.api('apiTurnoEliminarLista', C.S.token, id).then(function () { return refrescar(); }).catch(C.fallo);
      });
    },
    gparams: function () {
      var f = $('#tn-par', T.v), v = {}; ['editarHoras', 'diasAtras', 'diasAdelante', 'enc1', 'enc2', 'pie', 'ayudaObs'].forEach(function (k) { v[k] = f.elements[k].value; });
      C.api('apiTurnoGuardarParametros', C.S.token, v).then(function (r) { C.toast(r.mensaje, 'ok'); return refrescar(); }).catch(C.fallo);
    }
  };
  function clic(e) {
    var b = e.target.closest ? e.target.closest('[data-tn]') : null; if (!b || !T.v || !T.v.contains(b)) return;
    var a = ACCIONES[b.dataset.tn]; if (a) { if (b.tagName !== 'INPUT') e.preventDefault(); a(b, e); }
  }
  var tFiltro = null;
  function entrada(e) {
    var t = e.target;
    if (t.dataset.f && T.form) {
      var k = t.dataset.f; T.form.d[k] = t.type === 'checkbox' ? t.checked : t.value;
      if (t.type === 'checkbox') {
        var lab = t.closest('.tn-chk'); if (lab) lab.classList.toggle('on', t.checked);
        if (t.checked) { var otro = k === 'woL' ? 'woV' : k === 'woL' ? '' : 'woL'; if (k === 'woL' || k === 'woV') { var o = k === 'woL' ? 'woV' : 'woL'; T.form.d[o] = false; var oc = $('[data-f="' + o + '"]', T.v); if (oc) { oc.checked = false; oc.closest('.tn-chk').classList.remove('on'); } } }
      }
      t.classList.remove('mal'); derivado(); guardarBorrador();
    } else if (t.dataset.flt) {
      T.filt[t.dataset.flt] = t.value;
      if (t.tagName === 'SELECT') pintar(); else { clearTimeout(tFiltro); tFiltro = setTimeout(listaInformes, 200); }
    }
  }
  function cambio(e) {
    var t = e.target;
    if (t.id === 'f-foto' && t.files && t.files[0]) { reducirFoto(t.files[0]); return; }
    if (t.dataset.tn === 'todos') { T.todos = t.checked; cargar().then(function () { if (activa()) pintar(); }).catch(C.fallo); return; }
    var id = t.dataset.le || t.dataset.lm || t.dataset.la;
    if (id && T.d) {
      var x = T.d.arbitros.concat(T.d.mesa).filter(function (r) { return r.ID === Number(id); })[0]; if (!x) return;
      var nom = t.dataset.le ? t.value : x.Nombre, marca = t.dataset.lm ? t.checked : x.Marca, act = t.dataset.la ? t.checked : x.Activo;
      C.api('apiTurnoGuardarLista', C.S.token, { ID: x.ID, Nombre: nom, Marca: marca, Activo: act }).then(function () { C.toast('Guardado.', 'ok'); return refrescar(); }).catch(function (er) { C.fallo(er); refrescar(); });
    }
  }
  function reducirFoto(file) {
    var fr = new FileReader();
    fr.onload = function () {
      var im = new Image();
      im.onload = function () {
        var s = Math.min(1, 1200 / Math.max(im.width, im.height)), c = document.createElement('canvas');
        c.width = Math.round(im.width * s); c.height = Math.round(im.height * s);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        T.form.d.foto = c.toDataURL('image/jpeg', 0.72); T.form.d.quitarFoto = false; guardarBorrador(); pintar();
      };
      im.onerror = function () { C.toast('No se pudo leer esa imagen. Prueba con otra foto.', 'error'); };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  }

  // ════════════════ Conexión con el panel ════════════════
  window.addEventListener('online', function () { if (C.S.token) { vaciarCola(); if (activa()) pintar(); } });
  window.addEventListener('offline', function () { if (activa()) pintar(); });
  C.vistas.turnos = vistaTurnos;
  var previo = window.ABPA_PANEL || {};
  window.ABPA_PANEL = {
    alEntrar: function () {
      T.d = null; T.form = null; T.tab = 'pend'; T.todos = false; T.fotos = {};
      actualizarBadge();
      if (C.S.datos.sesion.rol === 'turno' || C.S.datos.sesion.rol === 'admin') vaciarCola();
      if (C.S.datos.sesion.rol !== 'turno' && previo.alEntrar) previo.alEntrar();
    }
  };
})();
</script>

</body>
